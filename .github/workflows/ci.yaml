name: CI

on: [push, pull_request]

jobs:
  check:
    name: Rust project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # stable is enough for clippy and rustfmt; nightly broke old locked dependencies (proc-macro2)
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update && rustup default stable
      - run: cargo clippy --all-targets
      - run: cargo fmt --all -- --check
      - run: cargo test
